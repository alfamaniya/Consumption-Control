name: آزمون سرتاسری صحت داده

on:
  push:
    branches: [main, 'test/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    name: گردش واقعی داده در مرورگر Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: نصب مرورگر و ابزار آزمون
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: ساخت نسخه مستقل از منابع جاری
        run: |
          node --check scripts/build-standalone.mjs
          node scripts/build-standalone.mjs
          test -s anbar-standalone.html

      - name: اجرای آزمون سرتاسری روی هر دو نسخه
        run: node tests/e2e/data-integrity.mjs
