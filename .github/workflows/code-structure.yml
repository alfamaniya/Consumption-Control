name: بررسی ساختار کد

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-structure:
    name: کنترل تگ‌ها و علائم ساختاری
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: نصب ابزارهای اعتبارسنجی
        run: npm install --no-save --no-package-lock html-validate postcss

      - name: بررسی ساخت نسخه مستقل
        run: |
          node --check scripts/build-standalone.mjs
          node scripts/build-standalone.mjs
          test -s anbar-standalone.html

      - name: بررسی HTML، JavaScript و CSS
        run: |
          node scripts/check-code-structure.mjs
          html_files=(index.html admin/*.html dashboard/*.html entry/*.html inventory/*.html kardex/*.html reports/*.html settings/*.html)
          if [[ -d tag-explorer ]]; then
            html_files+=(tag-explorer/*.html)
          fi
          npx html-validate "${html_files[@]}"
